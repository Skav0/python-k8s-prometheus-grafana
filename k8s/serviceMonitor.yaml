apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: python-app-servicemonitor
  namespace: default                       
  labels:
    release: kube-prometheus-stack         
spec:
  selector:
    matchLabels:
      app: python-app                     
  endpoints:
  - port: http                             
    path: /metrics                       
    interval: 15s                       